<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#075e54"><title>Launch Section Ferry Booking</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f6;color:#172321;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:560px;margin:auto;padding:16px}.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 30px #1232}
header{display:flex;gap:12px;align-items:center;margin-bottom:18px}.logo{font-size:30px;background:#e2f3ef;border-radius:15px;padding:10px}
h1{font-size:21px;margin:0}.sub{font-size:13px;color:#667572;margin-top:3px}
.title{display:block;font-weight:700;margin:18px 0 8px}input[type=date],textarea{width:100%;padding:13px;border:1px solid #cad8d4;border-radius:12px;font:inherit;font-size:16px}
.slots{display:grid;gap:9px}.slot{padding:14px;border:1.5px solid #d4e0dd;border-radius:13px;background:#fff;text-align:left;font:inherit;font-weight:650}.slot.active{border-color:#075e54;background:#eaf5f2;color:#075e54}
.people{display:grid;gap:7px;max-height:310px;overflow:auto}.person{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:11px;border:1px solid #dce6e3;border-radius:12px}.person input{width:19px;height:19px}.person span{font-weight:600;display:block}.person small{color:#687673}
.count{font-size:12px;color:#687673;margin-top:7px}.preview{white-space:pre-wrap;background:#f0f5f3;border-radius:13px;padding:14px;line-height:1.5;font-size:14px}
button.action{width:100%;margin-top:12px;padding:15px;border-radius:14px;font:700 16px system-ui}.send{border:0;background:#075e54;color:#fff}.copy{border:1px solid #075e54;background:#fff;color:#075e54}
.hint{font-size:12px;color:#71807d;line-height:1.45}
</style></head><body><main><section class="card">
<header><div class="logo">🚤</div><div><h1>Launch Section Ferry Booking</h1><div class="sub">Choose date, ferry and passenger(s).</div></div></header>

<label class="title">1. Travel date</label><input id="date" type="date">
<label class="title">2. Ferry time</label>
<div class="slots">
<button class="slot active" data-time="08:00 AM – 01:30 PM">08:00 AM – 01:30 PM</button>
<button class="slot" data-time="04:00 PM – 11:00 PM">04:00 PM – 11:00 PM</button>
<button class="slot" data-time="06:00 PM – 11:00 PM">06:00 PM – 11:00 PM</button>
</div>
<label class="title">3. Select passenger(s)</label>
<div class="people"><label class="person"><input type="checkbox" value="0"><span>Rashid Mohamed — 492258</span></label><label class="person"><input type="checkbox" value="1"><span>Hussain Jaleel — 226877</span></label><label class="person"><input type="checkbox" value="2"><span>Hussain Malaz — 490504</span></label><label class="person"><input type="checkbox" value="3"><span>Ali Nazeer — 490454</span></label><label class="person"><input type="checkbox" value="4"><span>Ali Mohamed Manik — 292092</span></label><label class="person"><input type="checkbox" value="5"><span>Ibrahim Rasheed — 491493</span></label><label class="person"><input type="checkbox" value="6"><span>Khalid Abbas — 491324</span></label><label class="person"><input type="checkbox" value="7"><span>Adam Naseem — 226882</span></label><label class="person"><input type="checkbox" value="8"><span>Ahmed Adam — 313271</span></label><label class="person"><input type="checkbox" value="9"><span>Hussain Ahmed — 226875</span></label><label class="person"><input type="checkbox" value="10"><span>Ali Mohamed — 490702</span></label><label class="person"><input type="checkbox" value="11"><span>Ismail Adam — 490348</span></label><label class="person"><input type="checkbox" value="12"><span>Moosa Adam — 490292</span></label><label class="person"><input type="checkbox" value="13"><span>Mohamed Ali — 491162</span></label><label class="person"><input type="checkbox" value="14"><span>Abdulla Rasheed — 329480</span></label><label class="person"><input type="checkbox" value="15"><span>Abdulla Rasheed — 279035</span></label><label class="person"><input type="checkbox" value="16"><span>Hassan Fayaz — 226908</span></label><label class="person"><input type="checkbox" value="17"><span>Ahmed Miyaz — 490088</span></label><label class="person"><input type="checkbox" value="18"><span>Ahmed Simad — 490109</span></label><label class="person"><input type="checkbox" value="19"><span>Mohamed Faariz — 491598</span></label><label class="person"><input type="checkbox" value="20"><span>Jinah Adam — 490803</span></label><label class="person"><input type="checkbox" value="21"><span>Abdul Jaleel Mohamed — 355004</span></label><label class="person"><input type="checkbox" value="22"><span>Ali Azmeen Ibrahim — 292093</span></label><label class="person"><input type="checkbox" value="23"><span>Ibrahim Shaheed — 335862</span></label><label class="person"><input type="checkbox" value="24"><span>Ahmed Akram — 226892</span></label><label class="person"><input type="checkbox" value="25"><span>Mohamed Latheef — 226893</span></label><label class="person"><input type="checkbox" value="26"><span>Adam Mohamed — 490613</span></label><label class="person"><input type="checkbox" value="27"><span>Ahmed Humaid — 491016</span></label><label class="person"><input type="checkbox" value="28"><span>Athif Mahmood — 491877</span></label><label class="person"><input type="checkbox" value="29"><span>Aboobakur Ibrahim — 492010</span></label><label class="person"><input type="checkbox" value="30"><span>Mohamed Abdul Nasir — 492087</span></label><label class="person"><input type="checkbox" value="31"><span>Ibrahim Rasheed — 492116</span></label></div><div class="count" id="count">0 selected</div>
<label class="title">4. Extra note</label><textarea id="note" rows="3" placeholder="Optional"></textarea>
<label class="title">5. Message preview</label><div class="preview" id="preview"></div>
<button class="action send" id="send">Send via WhatsApp</button>
<button class="action copy" id="copy">Copy Message</button>
<p class="hint">WhatsApp opens with the message ready. Choose the contact or group and tap Send.</p>
</section></main>
<script>
const people=[["Rashid Mohamed", "492258"], ["Hussain Jaleel", "226877"], ["Hussain Malaz", "490504"], ["Ali Nazeer", "490454"], ["Ali Mohamed Manik", "292092"], ["Ibrahim Rasheed", "491493"], ["Khalid Abbas", "491324"], ["Adam Naseem", "226882"], ["Ahmed Adam", "313271"], ["Hussain Ahmed", "226875"], ["Ali Mohamed", "490702"], ["Ismail Adam", "490348"], ["Moosa Adam", "490292"], ["Mohamed Ali", "491162"], ["Abdulla Rasheed", "329480"], ["Abdulla Rasheed", "279035"], ["Hassan Fayaz", "226908"], ["Ahmed Miyaz", "490088"], ["Ahmed Simad", "490109"], ["Mohamed Faariz", "491598"], ["Jinah Adam", "490803"], ["Abdul Jaleel Mohamed", "355004"], ["Ali Azmeen Ibrahim", "292093"], ["Ibrahim Shaheed", "335862"], ["Ahmed Akram", "226892"], ["Mohamed Latheef", "226893"], ["Adam Mohamed", "490613"], ["Ahmed Humaid", "491016"], ["Athif Mahmood", "491877"], ["Aboobakur Ibrahim", "492010"], ["Mohamed Abdul Nasir", "492087"], ["Ibrahim Rasheed", "492116"]];
const dateEl=document.getElementById('date'),note=document.getElementById('note'),preview=document.getElementById('preview'),count=document.getElementById('count');
const now=new Date(),local=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10);dateEl.value=local;dateEl.min=local;
let time='08:00 AM – 01:30 PM';
document.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{document.querySelectorAll('.slot').forEach(x=>x.classList.remove('active'));b.classList.add('active');time=b.dataset.time;render()});
function selected(){return [...document.querySelectorAll('.person input:checked')].map(x=>people[Number(x.value)])}
function message(){
 const d=new Date(dateEl.value+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});
 const p=selected();
 let m='Hello! Please add the following passenger'+(p.length===1?'':'s')+' to the ferry on '+d+', '+time+'.\n\n';
 m+=p.length?p.map((x,i)=>(i+1)+'. '+x[0]+' — ID '+x[1]).join('\n'):'[No passenger selected]';
 if(note.value.trim())m+='\n\nExtra note: '+note.value.trim();
 return m;
}
function render(){const p=selected();count.textContent=p.length+' selected';preview.textContent=message()}
document.querySelectorAll('.person input').forEach(x=>x.onchange=render);dateEl.oninput=render;note.oninput=render;
document.getElementById('send').onclick=()=>{if(!dateEl.value){alert('Please select a date.');return}window.location.href='https://wa.me/?text='+encodeURIComponent(message())};
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(message());alert('Message copied.')}catch(e){alert('Please select and copy the message from the preview.')}};
render();
</script></body></html>
